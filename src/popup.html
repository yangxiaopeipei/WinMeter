<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WinMeter · 资源速览</title>
  <link rel="icon" href="assets/winmeter.svg" type="image/svg+xml">
  <link rel="stylesheet" href="popup.css">
  <script>
  /* 和主界面一样：样式表默认是深色，浅色用户开弹窗会先闪一下深色。
     这里同步读上次的主题，赶在首帧前把 data-theme 定好。 */
  try {
    var t = localStorage.getItem('winmeter-theme');
    if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
  } catch (e) {}
  </script>
  <script type="module" src="popup.js"></script>
</head>
<body>
<main class="panel" aria-label="资源速览">
  <header class="bar">
    <div class="brand"><img src="assets/winmeter.svg" alt=""><strong>WinMeter</strong><span>资源速览</span></div>
    <div class="connection" role="status"><i id="status-dot"></i><span id="status">正在连接采样…</span></div>
    <button class="icon-button" id="close" aria-label="收起速览" title="收起 · Esc">×</button>
  </header>
  <div class="columns">
    <section class="column cpu" aria-labelledby="cpu-heading">
      <button class="heading" data-page="cpu"><svg><use href="#cpu-icon"/></svg><h2 id="cpu-heading">CPU</h2><span class="badge" id="cpu-temp">—</span></button>
      <div class="device" id="cpu-name" title="">等待处理器信息</div>
      <div class="gauge" id="cpu-ring"><div><strong id="cpu-value">—</strong><span>使用率</span></div></div>
      <dl class="details"><div><dt>物理 / 逻辑核心</dt><dd id="cpu-cores">—</dd></div><div><dt>进程</dt><dd id="processes">—</dd></div><div><dt>电源计划</dt><dd id="power-plan">—</dd></div></dl>
      <div class="history"><div class="caption"><span>使用率</span><span>最近 2 分钟</span></div><svg id="cpu-chart" class="chart" viewBox="0 0 240 80" preserveAspectRatio="none" aria-label="CPU 使用率历史"></svg></div>
    </section>
    <section class="column gpu" aria-labelledby="gpu-heading">
      <button class="heading" data-page="gpu"><svg><use href="#gpu-icon"/></svg><h2 id="gpu-heading">显卡</h2><span class="badge" id="gpu-temp">—</span></button>
      <div class="device" id="gpu-name">等待显卡信息</div>
      <div class="gauge" id="gpu-ring"><div><strong id="gpu-value">—</strong><span>使用率</span></div></div>
      <dl class="details"><div><dt>显存占用</dt><dd id="gpu-memory">—</dd></div><div><dt>显存容量</dt><dd id="gpu-total">—</dd></div><div><dt>温度</dt><dd id="gpu-temperature">—</dd></div></dl>
      <div class="history"><div class="caption"><span>使用率</span><span>最近 2 分钟</span></div><svg id="gpu-chart" class="chart" viewBox="0 0 240 80" preserveAspectRatio="none" aria-label="显卡使用率历史"></svg></div>
    </section>
    <section class="column memory" aria-labelledby="mem-heading">
      <button class="heading" data-page="mem"><svg><use href="#memory-icon"/></svg><h2 id="mem-heading">内存</h2><span class="meta" id="memory-total">—</span></button>
      <div class="device">物理内存</div>
      <div class="gauge" id="memory-ring"><div><strong id="memory-value">—</strong><span>已使用</span></div></div>
      <dl class="details"><div><dt><i class="key used"></i>使用中</dt><dd id="memory-used">—</dd></div><div><dt><i class="key standby"></i>备用缓存</dt><dd id="memory-standby">—</dd></div><div><dt><i class="key available"></i>可用</dt><dd id="memory-available">—</dd></div></dl>
      <div class="history"><div class="caption"><span>使用率</span><span>最近 2 分钟</span></div><svg id="memory-chart" class="chart" viewBox="0 0 240 80" preserveAspectRatio="none" aria-label="内存使用率历史"></svg></div>
    </section>
    <section class="column disk" aria-labelledby="disk-heading">
      <button class="heading" data-page="disk"><svg><use href="#disk-icon"/></svg><h2 id="disk-heading">磁盘</h2><span class="meta" id="disk-volume">—</span></button>
      <div class="device" id="disk-free">等待分区信息</div>
      <div class="capacity"><i id="disk-capacity"></i></div><div class="caption"><span id="disk-used">—</span><span id="disk-total">—</span></div>
      <div class="transfer"><span class="transfer-icon cyan">↓</span><div><span class="label">读取</span><strong id="disk-read">—</strong></div></div>
      <div class="transfer"><span class="transfer-icon pink">↑</span><div><span class="label">写入</span><strong id="disk-write">—</strong></div></div>
      <div class="history"><div class="caption"><span>实时读写</span><span><i class="key read"></i>读 <i class="key write"></i>写</span></div><svg id="disk-chart" class="chart" viewBox="0 0 240 80" preserveAspectRatio="none" aria-label="磁盘读取与写入速率历史"></svg></div>
    </section>
    <section class="column network" aria-labelledby="net-heading">
      <button class="heading" data-page="net"><svg><use href="#network-icon"/></svg><h2 id="net-heading">网络</h2><span class="meta" id="net-kind">—</span></button>
      <div class="device" id="net-ip">等待网络信息</div>
      <div class="transfer"><span class="transfer-icon amber">↑</span><div><span class="label">上传</span><strong id="net-up">—</strong></div></div>
      <div class="transfer"><span class="transfer-icon green">↓</span><div><span class="label">下载</span><strong id="net-down">—</strong></div></div>
      <dl class="details network-totals"><div><dt>本次上传</dt><dd id="net-sent">—</dd></div><div><dt>本次下载</dt><dd id="net-received">—</dd></div></dl>
      <div class="history"><div class="caption"><span>实时流量</span><span><i class="key upload"></i>↑ <i class="key download"></i>↓</span></div><svg id="net-chart" class="chart" viewBox="0 0 240 80" preserveAspectRatio="none" aria-label="网络上传与下载速率历史"></svg></div>
    </section>
    <section class="column sensors" aria-labelledby="sensors-heading">
      <button class="heading" data-page="info"><svg><use href="#sensor-icon"/></svg><h2 id="sensors-heading">传感器</h2></button>
      <div class="device" id="battery-state">电池</div>
      <div class="battery-summary"><strong id="battery-value">—</strong><div class="battery"><i id="battery-level"></i></div></div>
      <div class="caption" id="battery-note">等待电池信息</div>
      <div class="divider"></div><div class="section-label">温度</div>
      <dl class="details temperatures"><div><dt>CPU</dt><dd id="sensor-cpu">—</dd></div><div><dt>显卡</dt><dd id="sensor-gpu">—</dd></div><div><dt>磁盘</dt><dd id="sensor-disk">—</dd></div><div><dt>风扇</dt><dd id="sensor-fan">—</dd></div></dl>
      <div class="sensor-note" id="sensor-note">未提供的读数显示 —</div>
    </section>
  </div>
  <footer><span class="footer-note" id="updated">共享主界面的实时采样</span><div><button data-page="overview">完整主界面 <span>↗</span></button><button data-page="settings"><svg><use href="#settings-icon"/></svg>设置</button></div></footer>
</main>
<svg class="sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="cpu-icon" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v3m6-3v3M9 19v3m6-3v3M2 9h3m-3 6h3m14-6h3m-3 6h3"/></symbol>
  <symbol id="gpu-icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="13" rx="2"/><circle cx="13" cy="11.5" r="3.5"/><path d="M6 9v5M7 18v3M11 18v3M15 18v3M19 18v3"/></symbol>
  <symbol id="memory-icon" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="11" rx="2"/><path d="M6 10v3m4-3v3m4-3v3m4-3v3M6 17v3m4-3v3m4-3v3m4-3v3"/></symbol>
  <symbol id="disk-icon" viewBox="0 0 24 24"><path d="m3 12 3-7h12l3 7v7H3Z M3 12h18M7 16h.01M11 16h.01"/></symbol>
  <symbol id="network-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18M5 6.5q7 4 14 0M5 17.5q7-4 14 0"/></symbol>
  <symbol id="sensor-icon" viewBox="0 0 24 24"><path d="M9 14.5V5a3 3 0 0 1 6 0v9.5a5 5 0 1 1-6 0Z M12 8v10"/><circle cx="12" cy="18" r="1"/></symbol>
  <symbol id="settings-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m10 3-1 3-3 1-3-1-1 4 3 2-1 3-2 2 3 3 3-1 2 2h4l1-3 3-1 3 1 1-4-3-2 1-3 2-2-3-3-3 1-2-2Z"/></symbol>
</svg>
</body>
</html>
